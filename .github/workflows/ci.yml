# Pull-request CI for the Market Structure Lab site.
#
# Scope boundary (docs/DEPLOYMENT_CONTRACT.md section 2): this workflow runs on
# GitHub-hosted runners only. It must never reference self-hosted labels, the
# production environment, the root-owned deploy wrapper, or production
# credentials. It requires no secrets beyond the default read-only GITHUB_TOKEN.
#
# Action pinning: the platform contract prefers commit-pinned third-party
# actions. The tags below mirror the sibling application repo
# (dmedellin/pixelbattle-landing) because no verified commit SHA was available
# offline. Replace each tag with its verified 40-hex commit SHA before this repo
# is onboarded; do not guess a SHA.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # release.yml calls this workflow so that a protected-main build cannot be
  # published unless the exact same commit passed the exact same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request pushes may be cancelled. A release run may not:
  # queued releases must never terminate an in-flight one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  site:
    name: Site checks (well-formed, self-contained, links resolve)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve the web root
        id: webroot
        run: |
          set -euo pipefail
          # The container serves one directory as "/" for learn.geterdone.io.
          # Resolution order is deterministic:
          #   1. $SITE_WEB_ROOT if exported by a later change,
          #   2. site/ when site/index.html exists,
          #   3. the single immediate subdirectory of site/ when there is
          #      exactly one and site/index.html does not exist.
          # Anything else is ambiguous and fails, because a root-absolute link
          # cannot be resolved without knowing which directory is "/".
          root="${SITE_WEB_ROOT:-}"
          if [ -z "$root" ]; then
            if [ -f site/index.html ]; then
              root=site
            else
              mapfile -t subs < <(find site -mindepth 1 -maxdepth 1 -type d | sort)
              if [ "${#subs[@]}" -eq 1 ]; then
                root="${subs[0]}"
              else
                echo "::error::Cannot resolve the web root. Expected site/index.html or exactly one subdirectory of site/. Set SITE_WEB_ROOT to disambiguate."
                exit 1
              fi
            fi
          fi
          echo "Web root: $root"
          if [ ! -f "$root/index.html" ]; then
            echo "::warning file=$root::No index.html at the web root; https://learn.geterdone.io/ (the library index) would 404."
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Published URL space is complete
        env:
          WEB_ROOT: ${{ steps.webroot.outputs.root }}
        run: |
          set -euo pipefail
          # The public URL space — the site index, the paths layer, then a
          # course, then that course's lessons:
          #   /                                    the site index (paths + search)
          #   /paths/trading/                      the trading PATH PAGE
          #   /market-structure/                   course 1 home
          #   /market-structure/<lesson>/          course 1's seven lessons
          #   /trade-setup-execution/              course 2 home
          #   /trade-setup-execution/<lesson>/     course 2's fifteen lessons
          #   /options-trading/                    course 3 home
          #   /options-trading/<lesson>/           course 3's sixteen lessons
          #   /technical-indicators/               course 4 home
          #   /technical-indicators/<lesson>/      course 4's sixteen lessons
          #   /volume-and-order-flow/              course 5 home
          #   /volume-and-order-flow/<lesson>/     course 5's sixteen lessons
          #   /trading-risk-management/            course 6 home
          #   /trading-risk-management/<lesson>/   course 6's sixteen lessons
          #   /backtesting-and-trading-systems/    course 7 home
          #   /backtesting-and-trading-systems/<lesson>/
          #                                        course 7's sixteen lessons
          #   /algorithmic-and-automated-trading/  course 8 home
          #   /algorithmic-and-automated-trading/<lesson>/
          #                                        course 8's sixteen lessons
          # 128 pages, in path order, plus the two pages of the dated real-data
          # capstone at /paths/trading/iren-analysis-2026-08-16/ -- 130 pages --
          # plus eight published non-HTML assets (the seven course schemas and
          # the capstone's dataset).
          # Same map as REQUIRED_PAGES + NON_HTML_ASSETS in
          # tests/test_site_invariants.py, acceptance.checks in
          # release/contract.json, the publish guard in pages.yml, and the build
          # guard in Containerfile.release. A file missing here is a 404 on a
          # live URL, so fail the pull request rather than let an incomplete
          # course reach the publish step.
          # The path page is listed like any other page and is NOT a course:
          # /paths/ is the paths layer's own segment, so nothing under it may be
          # treated as a course home or a lesson.
          # The seven FLAT /<lesson>/ URLs this site used to serve are retired
          # with no redirect stub, and so is course 1's old
          # /market-structure-lab/ prefix. They are deliberately absent from
          # this list and must not be re-added.
          # After the eight courses, the path publishes one DATED, REAL-DATA
          # capstone: /paths/trading/iren-analysis-2026-08-16/ (interactive lab)
          # and its /slides/ deck, plus the dataset they derive from. It is NOT a
          # ninth course -- the path is complete at eight -- and it is the only
          # published material built from real market data, which is why its
          # pages carry a real-data notice instead of the synthetic-examples
          # disclaimer every course page carries. See REAL_DATA_PAGES in
          # tests/test_site_invariants.py.
          missing=0
          pages=0
          # --- the DISCRETE MATHEMATICS path below: one path page, eight
          # --- course homes and 106 lessons. These pages are GENERATED from
          # --- content/discrete_math/ by scripts/build_paths.py, and
          # --- the suite fails if a published page differs from what that
          # --- script renders (TestGeneratedPathIsCurrent).
          for page in index.html \
                      paths/trading/index.html \
                      paths/trading/iren-analysis-2026-08-16/index.html \
                      paths/trading/iren-analysis-2026-08-16/slides/index.html \
