# GitHub Pages delivery for learn.geterdone.io
#
# This is a SEPARATE delivery path from the Hetzner platform. It does not
# touch platform-ops, the shared Caddy edge, or any registry reservation,
# and it is NOT a shortcut around those gates -- they govern the Hetzner
# platform, which remains unbuilt. See README STATUS.
#
# PREREQUISITE: the repository must be PUBLIC (GitHub Pages on a private
# repo requires a paid plan), and Settings > Pages > Source must be set to
# "GitHub Actions". Until then this workflow is inert by the `if` below.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Inert while the repo is private: Pages cannot publish and the run would
    # fail confusingly. Flips on automatically once visibility changes.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the published tree is self-contained
        run: |
          set -eu
          # The invariant the test suite enforces, re-checked at publish time:
          # a page that reaches out to a third party must never go live.
          if grep -rEn 'src="https?://|@import|XMLHttpRequest|fetch\(' site/ ; then
            echo "::error::external reference found in site/ -- refusing to publish"
            exit 1
          fi
          # The published URL space: the site index at /, the path page at
          # /paths/trading/, a home per course (/market-structure/,
          # /trade-setup-execution/, /options-trading/, /technical-indicators/,
          # /volume-and-order-flow/, /trading-risk-management/,
          # /backtesting-and-trading-systems/ and
          # /algorithmic-and-automated-trading/), and each course's lessons
          # beneath its own home -- 128 pages, in path order -- plus the two
          # pages of the dated real-data capstone at
          # /paths/trading/iren-analysis-2026-08-16/ for 130 in all, plus eight
          # published non-HTML assets (seven course schemas and the capstone's
          # dataset). Same map as REQUIRED_PAGES + NON_HTML_ASSETS in
          # tests/test_site_invariants.py and acceptance.checks in
          # release/contract.json. Publishing a tree that is missing a page
          # would 404 a live URL, so refuse instead.
          # The path page is a page like any other here, and it is NOT a course:
          # /paths/ belongs to the paths layer, and no course may take it.
          # The seven flat /<lesson>/ URLs are retired with no redirect stub,
          # and so is course 1's old /market-structure-lab/ prefix; neither is
          # listed here and neither may come back.
          # After the eight courses, the path publishes one DATED, REAL-DATA
          # capstone: /paths/trading/iren-analysis-2026-08-16/ (interactive lab)
          # and its /slides/ deck, plus the dataset they derive from. It is NOT a
          # ninth course -- the path is complete at eight -- and it is the only
          # published material built from real market data, which is why its
          # pages carry a real-data notice instead of the synthetic-examples
          # disclaimer every course page carries. See REAL_DATA_PAGES in
          # tests/test_site_invariants.py.
          missing=0
          pages=0
          for page in index.html \
                      paths/trading/index.html \
                      paths/trading/iren-analysis-2026-08-16/index.html \
                      paths/trading/iren-analysis-2026-08-16/slides/index.html \
                      market-structure/index.html \
                      market-structure/market-structure/index.html \
                      market-structure/ranges-breakouts-liquidity/index.html \
                      market-structure/multi-timeframe-market-structure/index.html \
                      market-structure/pullbacks-entry-models/index.html \
                      market-structure/invalidation-stops-risk-reward/index.html \
                      market-structure/volume-relative-strength/index.html \
                      market-structure/options-contract-selection/index.html \
                      trade-setup-execution/index.html \
                      trade-setup-execution/trade-thesis/index.html \
                      trade-setup-execution/support-resistance/index.html \
                      trade-setup-execution/confluence/index.html \
                      trade-setup-execution/breakout-setups/index.html \
                      trade-setup-execution/pullback-setups/index.html \
                      trade-setup-execution/reversal-setups/index.html \
                      trade-setup-execution/entry-confirmation/index.html \
                      trade-setup-execution/stop-loss-placement/index.html \
                      trade-setup-execution/profit-targets/index.html \
                      trade-setup-execution/risk-to-reward/index.html \
                      trade-setup-execution/position-sizing/index.html \
                      trade-setup-execution/trade-management/index.html \
                      trade-setup-execution/backtesting/index.html \
                      trade-setup-execution/trading-journal/index.html \
                      trade-setup-execution/performance-review/index.html \
                      options-trading/index.html \
                      options-trading/options-contract-fundamentals/index.html \
                      options-trading/calls-and-puts/index.html \
                      options-trading/moneyness/index.html \
                      options-trading/option-premium/index.html \
                      options-trading/option-chain-and-liquidity/index.html \
                      options-trading/expiration-and-time-decay/index.html \
                      options-trading/implied-volatility/index.html \
                      options-trading/delta-and-gamma/index.html \
                      options-trading/theta-and-vega/index.html \
                      options-trading/long-calls-and-long-puts/index.html \
                      options-trading/covered-calls/index.html \
                      options-trading/cash-secured-puts/index.html \
                      options-trading/vertical-debit-spreads/index.html \
                      options-trading/vertical-credit-spreads/index.html \
                      options-trading/exercise-assignment-and-expiration/index.html \
                      options-trading/options-trade-planning/index.html \
                      technical-indicators/index.html \
                      technical-indicators/technical-indicator-fundamentals/index.html \
                      technical-indicators/moving-averages/index.html \
                      technical-indicators/moving-average-crossovers/index.html \
                      technical-indicators/relative-strength-index/index.html \
                      technical-indicators/stochastic-oscillator/index.html \
                      technical-indicators/macd/index.html \
                      technical-indicators/average-directional-index/index.html \
                      technical-indicators/average-true-range/index.html \
                      technical-indicators/bollinger-bands/index.html \
                      technical-indicators/keltner-channels/index.html \
                      technical-indicators/donchian-channels/index.html \
                      technical-indicators/rate-of-change-and-momentum/index.html \
                      technical-indicators/indicator-divergence/index.html \
                      technical-indicators/combining-indicators/index.html \
                      technical-indicators/indicator-selection-by-market-regime/index.html \
                      technical-indicators/indicator-based-trading-rules/index.html \
                      volume-and-order-flow/index.html \
                      volume-and-order-flow/volume-fundamentals/index.html \
                      volume-and-order-flow/price-volume-relationships/index.html \
                      volume-and-order-flow/relative-volume-and-volume-spikes/index.html \
                      volume-and-order-flow/volume-confirmation/index.html \
                      volume-and-order-flow/on-balance-volume/index.html \
                      volume-and-order-flow/accumulation-distribution-and-chaikin-money-flow/index.html \
                      volume-and-order-flow/volume-weighted-average-price/index.html \
                      volume-and-order-flow/anchored-volume-weighted-average-price/index.html \
                      volume-and-order-flow/volume-profile/index.html \
                      volume-and-order-flow/value-area-poc-hvn-lvn/index.html \
                      volume-and-order-flow/bid-ask-spread-and-order-types/index.html \
                      volume-and-order-flow/time-and-sales/index.html \
                      volume-and-order-flow/footprint-charts-and-bid-ask-delta/index.html \
                      volume-and-order-flow/cumulative-volume-delta/index.html \
                      volume-and-order-flow/order-book-and-market-depth/index.html \
                      volume-and-order-flow/volume-and-order-flow-trading-rules/index.html \
                      trading-risk-management/index.html \
                      trading-risk-management/risk-management-fundamentals/index.html \
                      trading-risk-management/account-risk-and-risk-budget/index.html \
                      trading-risk-management/risk-per-trade/index.html \
                      trading-risk-management/stop-loss-and-structural-invalidation/index.html \
                      trading-risk-management/position-sizing/index.html \
                      trading-risk-management/reward-to-risk-and-r-multiples/index.html \
                      trading-risk-management/win-rate-average-win-loss-and-expectancy/index.html \
                      trading-risk-management/losing-streaks-and-drawdown/index.html \
                      trading-risk-management/risk-of-ruin/index.html \
                      trading-risk-management/volatility-and-atr-based-risk/index.html \
                      trading-risk-management/gap-slippage-liquidity-and-execution-risk/index.html \
                      trading-risk-management/leverage-and-margin-risk/index.html \
                      trading-risk-management/correlation-concentration-and-portfolio-exposure/index.html \
                      trading-risk-management/options-risk-management/index.html \
                      trading-risk-management/daily-and-weekly-risk-limits/index.html \
                      trading-risk-management/trading-risk-plan/index.html \
                      backtesting-and-trading-systems/index.html \
                      backtesting-and-trading-systems/backtesting-fundamentals/index.html \
                      backtesting-and-trading-systems/testable-trading-rules-and-hypotheses/index.html \
                      backtesting-and-trading-systems/historical-data-and-data-quality/index.html \
                      backtesting-and-trading-systems/survivorship-selection-and-corporate-actions/index.html \
                      backtesting-and-trading-systems/timeframes-sessions-and-bar-construction/index.html \
                      backtesting-and-trading-systems/signal-timing-look-ahead-bias-and-data-leakage/index.html \
                      backtesting-and-trading-systems/trade-execution-simulation/index.html \
                      backtesting-and-trading-systems/position-sizing-and-portfolio-accounting/index.html \
                      backtesting-and-trading-systems/transaction-costs-spread-slippage-and-liquidity/index.html \
                      backtesting-and-trading-systems/trade-log-equity-curve-and-drawdown/index.html \
                      backtesting-and-trading-systems/performance-metrics-and-expectancy/index.html \
                      backtesting-and-trading-systems/benchmarking-and-risk-adjusted-performance/index.html \
                      backtesting-and-trading-systems/in-sample-validation-and-out-of-sample-data/index.html \
                      backtesting-and-trading-systems/walk-forward-testing/index.html \
                      backtesting-and-trading-systems/overfitting-sensitivity-monte-carlo-and-stress-testing/index.html \
                      backtesting-and-trading-systems/trading-system-specification-and-backtest-report/index.html \
                      algorithmic-and-automated-trading/index.html \
                      algorithmic-and-automated-trading/algorithmic-and-automated-trading-fundamentals/index.html \
                      algorithmic-and-automated-trading/trading-system-architecture-and-components/index.html \
                      algorithmic-and-automated-trading/market-data-ingestion-and-normalization/index.html \
                      algorithmic-and-automated-trading/time-sessions-events-and-scheduling/index.html \
                      algorithmic-and-automated-trading/signal-engine-and-strategy-state/index.html \
                      algorithmic-and-automated-trading/portfolio-position-and-risk-engine/index.html \
                      algorithmic-and-automated-trading/broker-apis-and-order-lifecycle/index.html \
                      algorithmic-and-automated-trading/order-management-and-execution/index.html \
                      algorithmic-and-automated-trading/paper-trading-and-forward-testing/index.html \
                      algorithmic-and-automated-trading/scanners-alerts-and-human-approval/index.html \
                      algorithmic-and-automated-trading/reliability-idempotency-retries-and-recovery/index.html \
                      algorithmic-and-automated-trading/observability-logging-and-auditability/index.html \
                      algorithmic-and-automated-trading/security-secrets-permissions-and-kill-switches/index.html \
                      algorithmic-and-automated-trading/deployment-environments-and-configuration/index.html \
                      algorithmic-and-automated-trading/ai-assisted-and-agentic-trading-workflows/index.html \
                      algorithmic-and-automated-trading/automated-trading-system-specification-and-production-readiness/index.html ; do
            pages=$((pages + 1))
            if [ ! -f "site/$page" ]; then
              echo "::error::missing site/$page -- refusing to publish an incomplete course"
              missing=1
            fi
          done
          # Seven courses ship an exchange schema as a real published file, and the
          # capstone ships the dataset its two pages derive from:
          # course 2's lesson 14 exports the journal shape and its lesson 15
          # imports it, course 3's lesson 16 exports the trade plan shape,
          # course 4's lesson 16 exports the indicator rule shape, course
          # 5's lesson 16 exports the volume and order flow rule shape, course
          # 6's lesson 16 exports the trading risk plan shape, course 7's
          # lesson 16 exports the trading system specification shape, and
          # course 8's lesson 16 exports the automated trading system shape.
          # Each course home links to its file. An unparseable one 404s nothing
          # and breaks the handoff silently, so all seven are parsed here, not
          # merely counted -- and declared as assets rather than pushed through
          # the page loop above, which asserts things only a document can have.
          for asset in trade-setup-execution/trade-journal-schema.json \
                       options-trading/options-trade-plan-schema.json \
                       technical-indicators/indicator-rule-schema.json \
                       volume-and-order-flow/volume-order-flow-rule-schema.json \
                       trading-risk-management/trading-risk-plan-schema.json \
                       backtesting-and-trading-systems/trading-system-specification-schema.json \
                       algorithmic-and-automated-trading/automated-trading-system-schema.json \
                       paths/trading/iren-analysis-2026-08-16/iren-analysis-data.json ; do
            if [ ! -f "site/$asset" ]; then
              echo "::error::missing site/$asset -- refusing to publish an incomplete course"
              missing=1
            elif ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "site/$asset"; then
              echo "::error::site/$asset does not parse as JSON -- refusing to publish"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "self-containment OK; all $pages pages and 8 assets present"

      # NOTE: `enablement: true` was tried here and fails --- GITHUB_TOKEN
      # cannot create a Pages site ("Resource not accessible by integration").
      # Enabling Pages is a one-time administrative action, done out of band:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      # Once enabled, this step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
