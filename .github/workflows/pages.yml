                      quadratics-and-complex-numbers/quadratic-inequalities/index.html \
                      quadratics-and-complex-numbers/equations-reducible-to-quadratic-form/index.html \
                      exponential-and-logarithmic-functions/index.html \
                      exponential-and-logarithmic-functions/exponential-functions/index.html \
                      exponential-and-logarithmic-functions/growth-and-decay/index.html \
                      exponential-and-logarithmic-functions/the-number-e/index.html \
                      exponential-and-logarithmic-functions/what-a-logarithm-is/index.html \
                      exponential-and-logarithmic-functions/logarithmic-functions-and-their-graphs/index.html \
                      exponential-and-logarithmic-functions/the-laws-of-logarithms/index.html \
                      exponential-and-logarithmic-functions/common-and-natural-logarithms/index.html \
                      exponential-and-logarithmic-functions/change-of-base/index.html \
                      exponential-and-logarithmic-functions/solving-exponential-equations/index.html \
                      exponential-and-logarithmic-functions/solving-logarithmic-equations/index.html \
                      exponential-and-logarithmic-functions/compound-interest-and-continuous-growth/index.html \
                      exponential-and-logarithmic-functions/logarithmic-scales/index.html \
                      systems-and-matrices/index.html \
                      systems-and-matrices/systems-of-two-linear-equations/index.html \
                      systems-and-matrices/solving-by-substitution/index.html \
                      systems-and-matrices/solving-by-elimination/index.html \
                      systems-and-matrices/systems-in-three-variables/index.html \
                      systems-and-matrices/matrices-and-row-operations/index.html \
                      systems-and-matrices/gaussian-elimination/index.html \
                      systems-and-matrices/matrix-arithmetic/index.html \
                      systems-and-matrices/determinants-and-cramers-rule/index.html \
                      systems-and-matrices/inverse-matrices/index.html \
                      systems-and-matrices/systems-of-inequalities-and-linear-programming/index.html \
                      sequences-and-series/index.html \
                      sequences-and-series/sequences-and-recursion/index.html \
                      sequences-and-series/sigma-notation/index.html \
                      sequences-and-series/arithmetic-sequences-and-series/index.html \
                      sequences-and-series/geometric-sequences-and-series/index.html \
                      sequences-and-series/partial-sums-and-telescoping/index.html \
                      sequences-and-series/infinite-geometric-series/index.html \
                      sequences-and-series/repeating-decimals-as-series/index.html \
                      sequences-and-series/annuities-and-accumulated-payments/index.html \
                      sequences-and-series/pascals-triangle/index.html \
                      sequences-and-series/the-binomial-theorem/index.html \
                      sequences-and-series/the-general-term-of-an-expansion/index.html \
                      oauth2/spa/callback/index.html \
                      progress/index.html ; do
            pages=$((pages + 1))
            if [ ! -f "site/$page" ]; then
              echo "::error::missing site/$page -- refusing to publish an incomplete course"
              missing=1
            fi
          done
          # Seven courses ship an exchange schema as a real published file, and the
          # capstone ships the dataset its two pages derive from:
          # course 2's lesson 14 exports the journal shape and its lesson 15
          # imports it, course 3's lesson 16 exports the trade plan shape,
          # course 4's lesson 16 exports the indicator rule shape, course
          # 5's lesson 16 exports the volume and order flow rule shape, course
          # 6's lesson 16 exports the trading risk plan shape, course 7's
          # lesson 16 exports the trading system specification shape, and
          # course 8's lesson 16 exports the automated trading system shape.
          # Each course home links to its file. An unparseable one 404s nothing
          # and breaks the handoff silently, so all seven are parsed here, not
          # merely counted -- and declared as assets rather than pushed through
          # the page loop above, which asserts things only a document can have.
          for asset in trade-setup-execution/trade-journal-schema.json \
                       options-trading/options-trade-plan-schema.json \
                       technical-indicators/indicator-rule-schema.json \
                       volume-and-order-flow/volume-order-flow-rule-schema.json \
                       trading-risk-management/trading-risk-plan-schema.json \
                       backtesting-and-trading-systems/trading-system-specification-schema.json \
                       algorithmic-and-automated-trading/automated-trading-system-schema.json \
                       paths/trading/iren-analysis-2026-08-16/iren-analysis-data.json ; do
            if [ ! -f "site/$asset" ]; then
              echo "::error::missing site/$asset -- refusing to publish an incomplete course"
              missing=1
            elif ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "site/$asset"; then
              echo "::error::site/$asset does not parse as JSON -- refusing to publish"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "self-containment OK; all $pages pages and 8 assets present"

      # NOTE: `enablement: true` was tried here and fails --- GITHUB_TOKEN
      # cannot create a Pages site ("Resource not accessible by integration").
      # Enabling Pages is a one-time administrative action, done out of band:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      # Once enabled, this step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
