# GitHub Pages delivery for learn.geterdone.io
#
# This is a SEPARATE delivery path from the Hetzner platform. It does not
# touch platform-ops, the shared Caddy edge, or any registry reservation,
# and it is NOT a shortcut around those gates -- they govern the Hetzner
# platform, which remains unbuilt. See README STATUS.
#
# PREREQUISITE: the repository must be PUBLIC (GitHub Pages on a private
# repo requires a paid plan), and Settings > Pages > Source must be set to
# "GitHub Actions". Until then this workflow is inert by the `if` below.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Inert while the repo is private: Pages cannot publish and the run would
    # fail confusingly. Flips on automatically once visibility changes.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify the published tree is self-contained
        run: |
          set -eu
          # The invariant the test suite enforces, re-checked at publish time:
          # a page that reaches out to a third party must never go live.
          if grep -rEn 'src="https?://|@import|XMLHttpRequest|fetch\(' site/ ; then
            echo "::error::external reference found in site/ -- refusing to publish"
            exit 1
          fi
          # The published URL space, two levels deep: the learning path at /,
          # a home per course (/market-structure-lab/, /trade-setup-execution/
          # and /options-trading/), and each course's lessons beneath its own
          # home -- 42 pages, in course order -- plus two published non-HTML
          # assets. Same map as REQUIRED_PAGES + NON_HTML_ASSETS in
          # tests/test_site_invariants.py and acceptance.checks in
          # release/contract.json. Publishing a tree that is missing a page
          # would 404 a live URL, so refuse instead.
          # The seven flat /<lesson>/ URLs are retired with no redirect stub;
          # they are not listed here and must not come back.
          missing=0
          pages=0
          for page in index.html \
                      market-structure-lab/index.html \
                      market-structure-lab/market-structure/index.html \
                      market-structure-lab/ranges-breakouts-liquidity/index.html \
                      market-structure-lab/multi-timeframe-market-structure/index.html \
                      market-structure-lab/pullbacks-entry-models/index.html \
                      market-structure-lab/invalidation-stops-risk-reward/index.html \
                      market-structure-lab/volume-relative-strength/index.html \
                      market-structure-lab/options-contract-selection/index.html \
                      trade-setup-execution/index.html \
                      trade-setup-execution/trade-thesis/index.html \
                      trade-setup-execution/support-resistance/index.html \
                      trade-setup-execution/confluence/index.html \
                      trade-setup-execution/breakout-setups/index.html \
                      trade-setup-execution/pullback-setups/index.html \
                      trade-setup-execution/reversal-setups/index.html \
                      trade-setup-execution/entry-confirmation/index.html \
                      trade-setup-execution/stop-loss-placement/index.html \
                      trade-setup-execution/profit-targets/index.html \
                      trade-setup-execution/risk-to-reward/index.html \
                      trade-setup-execution/position-sizing/index.html \
                      trade-setup-execution/trade-management/index.html \
                      trade-setup-execution/backtesting/index.html \
                      trade-setup-execution/trading-journal/index.html \
                      trade-setup-execution/performance-review/index.html \
                      options-trading/index.html \
                      options-trading/options-contract-fundamentals/index.html \
                      options-trading/calls-and-puts/index.html \
                      options-trading/moneyness/index.html \
                      options-trading/option-premium/index.html \
                      options-trading/option-chain-and-liquidity/index.html \
                      options-trading/expiration-and-time-decay/index.html \
                      options-trading/implied-volatility/index.html \
                      options-trading/delta-and-gamma/index.html \
                      options-trading/theta-and-vega/index.html \
                      options-trading/long-calls-and-long-puts/index.html \
                      options-trading/covered-calls/index.html \
                      options-trading/cash-secured-puts/index.html \
                      options-trading/vertical-debit-spreads/index.html \
                      options-trading/vertical-credit-spreads/index.html \
                      options-trading/exercise-assignment-and-expiration/index.html \
                      options-trading/options-trade-planning/index.html ; do
            pages=$((pages + 1))
            if [ ! -f "site/$page" ]; then
              echo "::error::missing site/$page -- refusing to publish an incomplete course"
              missing=1
            fi
          done
          # Two courses ship an exchange schema as a real published file:
          # course 2's lesson 14 exports the journal shape and its lesson 15
          # imports it, and course 3's lesson 16 exports the trade plan shape.
          # Each course home links to its file. An unparseable one 404s nothing
          # and breaks the handoff silently, so both are parsed here, not merely
          # counted -- and declared as assets rather than pushed through the
          # page loop above, which asserts things only a document can have.
          for asset in trade-setup-execution/trade-journal-schema.json \
                       options-trading/options-trade-plan-schema.json ; do
            if [ ! -f "site/$asset" ]; then
              echo "::error::missing site/$asset -- refusing to publish an incomplete course"
              missing=1
            elif ! python3 -c "import json,sys; json.load(open(sys.argv[1]))" "site/$asset"; then
              echo "::error::site/$asset does not parse as JSON -- refusing to publish"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "self-containment OK; all $pages pages and 2 assets present"

      # NOTE: `enablement: true` was tried here and fails --- GITHUB_TOKEN
      # cannot create a Pages site ("Resource not accessible by integration").
      # Enabling Pages is a one-time administrative action, done out of band:
      #   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow
      # Once enabled, this step only reads the existing configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
